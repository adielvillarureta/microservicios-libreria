  #     - microservicios_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      # Servidor por defecto: microservicio COMERCIAL
      PMA_HOST: db_comercial
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: rootpass
      # Registra los DOS microservicios para ver ambas bases desde phpMyAdmin
      PMA_HOSTS: "db_comercial:3306,db_inventario:3306"
      PMA_ARBITRARY: "1"
    depends_on:
      db_comercial:
        condition: service_healthy
      db_inventario:
        condition: service_healthy
    networks:
      - microservicios_net

networks:
  microservicios_net:
    driver: bridge

volumes:
  comercial_data:
  inventario_data: