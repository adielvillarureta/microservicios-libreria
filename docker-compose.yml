services:
  db_comercial:
    image: mysql:8.0
    container_name: db_comercial
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: comercial_db
      MYSQL_USER: comercial_user
      MYSQL_PASSWORD: comercial_password
    ports:
      - "3307:3306"
    volumes:
      - comercial_data:/var/lib/mysql
      - ./bd:/bd:ro
      - ./bd/docker-entrypoint-initdb.d_comercial:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservicios_net

  db_inventario:
    image: mysql:8.0
    container_name: db_inventario
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: inventario_password
    ports:
      - "3308:3306"
    volumes:
      - inventario_data:/var/lib/mysql
      - ./bd:/bd:ro
      - ./bd/docker-entrypoint-initdb.d_inventario:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservicios_net

  # ==========================================================================
  #  LAS APLICACIONES YA NO CORREN EN DOCKER
  #  Comercial  -> localhost:5001   (python app.py)
  #  Inventario -> localhost:5000   (python app.py)
  #  Aqui solo viven las bases de datos y phpMyAdmin para verlas.
  #  Los servicios de aplicacion se dejan comentados abajo por si los
  #  necesitas mas adelante (tienen los puertos ya intercambiados).
