services:
  db_comercial:
    image: mysql:8.0
    container_name: db_comercial
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: comercial_db
      MYSQL_USER: comercial_user
      MYSQL_PASSWORD: comercial_password
    ports:
      - "3307:3306"
    volumes:
      - comercial_data:/var/lib/mysql
      - ./bd:/bd:ro
      - ./bd/docker-entrypoint-initdb.d_comercial:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservicios_net

  db_inventario:
    image: mysql:8.0
    container_name: db_inventario
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: inventario_password
    ports:
      - "3308:3306"
    volumes:
      - inventario_data:/var/lib/mysql
      - ./bd:/bd:ro
      - ./bd/docker-entrypoint-initdb.d_inventario:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservicios_net

  comercial:
    build: ./Comercial
    container_name: comercial
    restart: always
    environment:
      FLASK_ENV: production
      DEBUG: "false"
      SECRET_KEY: clave_secreta_comercial
      MYSQL_DATABASE: comercial_db
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_HOST: db_comercial
      MYSQL_PORT: 3306
      INVENTARIO_API_URL: http://inventario:5000
      INVENTARIO_PUBLIC_URL: http://localhost:5000
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMS_STORE_PHONE: ${SMS_STORE_PHONE:- (064) 247763}
      SMS_COUNTRY_CODE: ${SMS_COUNTRY_CODE:-+51}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    ports:
      - "5001:5001"
    depends_on:
      db_comercial:
        condition: service_healthy
    networks:
      - microservicios_net

  inventario:
    build: "./Inventario y gestión interna"
    container_name: inventario
    restart: always
    environment:
      FLASK_ENV: production
      DEBUG: "false"
      SECRET_KEY: clave_secreta_inventario
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_HOST: db_inventario
      MYSQL_PORT: 3306
      COMERCIAL_API_URL: http://comercial:5001
      INVENTARIO_PUBLIC_URL: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      db_inventario:
        condition: service_healthy
      comercial:
        condition: service_started
    networks:
      - microservicios_net

  gateway:
    build: ./apiGateway/apiGateway
    container_name: gateway
    restart: always
    environment:
      COMERCIAL_URL: http://comercial:5001
      INVENTARIO_URL: http://inventario:5000
      COMERCIAL_PUBLIC_URL: http://localhost:5001
      INVENTARIO_PUBLIC_URL: http://localhost:5000
      SECRET_KEY: clave_secreta_gateway
    ports:
      - "8000:8000"
    depends_on:
      - comercial
      - inventario
    networks:
      - microservicios_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db_comercial
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: rootpass
      PMA_HOSTS: "db_comercial:3306,db_inventario:3306"
      PMA_ARBITRARY: "1"
    depends_on:
      db_comercial:
        condition: service_healthy
      db_inventario:
        condition: service_healthy
    networks:
      - microservicios_net

networks:
  microservicios_net:
    driver: bridge

volumes:
  comercial_data:
  inventario_data:
