services:
  db_comercial:
    image: mysql:8.0
    container_name: db_comercial
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: comercial_db
      MYSQL_USER: comercial_user
      MYSQL_PASSWORD: comercial_password
    ports:
      - "3307:3306"
    volumes:
      - comercial_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservicios_net

  db_inventario:
    image: mysql:8.0
    container_name: db_inventario
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: inventario_password
    ports:
      - "3308:3306"
    volumes:
      - inventario_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservicios_net

  comercial:
    build: ./Comercial
    container_name: comercial
    restart: always
    environment:
      FLASK_ENV: production
      DEBUG: "false"
      SECRET_KEY: clave_secreta_comercial
      MYSQL_DATABASE: comercial_db
      MYSQL_USER: comercial_user
      MYSQL_PASSWORD: comercial_password
      MYSQL_HOST: db_comercial
      MYSQL_PORT: 3306
      INVENTARIO_API_URL: http://inventario:5001
      EMAIL_HOST: smtp-librospe.alwaysdata.net
      EMAIL_PORT: 587
      EMAIL_USER: librospe@alwaysdata.net
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: librospe@alwaysdata.net
      API_PERU_TOKEN: ${API_PERU_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    ports:
      - "5000:5000"
    depends_on:
      db_comercial:
        condition: service_healthy
      inventario:
        condition: service_started
    networks:
      - microservicios_net

  inventario:
    build: ./Inventario y gestión interna
    container_name: inventario
    restart: always
    environment:
      FLASK_ENV: production
      DEBUG: "false"
      SECRET_KEY: clave_secreta_inventario
      MYSQL_DATABASE: inventario_db
      MYSQL_USER: inventario_user
      MYSQL_PASSWORD: inventario_password
      MYSQL_HOST: db_inventario
      MYSQL_PORT: 3306
    ports:
      - "5001:5001"
    depends_on:
      db_inventario:
        condition: service_healthy
    networks:
      - microservicios_net

  gateway:
    build: ./apiGateway/apiGateway
    container_name: gateway
    restart: always
    environment:
      COMERCIAL_URL: http://comercial:5000
      INVENTARIO_URL: http://inventario:5001
      SECRET_KEY: clave_secreta_gateway
    ports:
      - "8000:8000"
    depends_on:
      comercial:
        condition: service_started
      inventario:
        condition: service_started
    networks:
      - microservicios_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_ARBITRARY: 1
    networks:
      - microservicios_net

networks:
  microservicios_net:
    driver: bridge

volumes:
  comercial_data:
  inventario_data: