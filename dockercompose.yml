version: '3.8'

services:
  # API Gateway
  gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - COMMERCIAL_URL=http://commercial:8001
      - INVENTARIO_URL=http://inventario:8002
    depends_on:
      - commercial
      - inventario
    networks:
      - microservicios-network
    restart: unless-stopped

  # Microservicio Comercial
  commercial:
    build: ./commercial
    container_name: microservicio-comercial
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY_COMMERCIAL}
    networks:
      - microservicios-network
    restart: unless-stopped

  # Microservicio Inventario
  inventario:
    build: ./inventario-gestion
    container_name: microservicio-inventario
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY_INVENTARIO}
    networks:
      - microservicios-network
    restart: unless-stopped

networks:
  microservicios-network:
    driver: bridge