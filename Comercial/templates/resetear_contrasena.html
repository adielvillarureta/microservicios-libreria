{% extends 'base_cliente.html' %}
{% block titulito %}Restablecer Contraseña{% endblock %}

{% block contenido %}
<div class="row justify-content-center py-4">
  <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

      <div class="card-header header-navy text-white text-center py-3">
        <i class="fas fa-lock fs-4 d-block mb-1" style="color: var(--salesiano-gold);"></i>
        <h5 class="mb-0" style="font-family: 'Playfair Display', serif;">Crear nueva contraseña</h5>
      </div>

      <div class="card-body p-4">
        <form method="POST">

          <div class="mb-3">
            <label for="nueva" class="form-label fw-semibold small text-muted">
              Nueva contraseña
            </label>
            <input type="password" name="nueva" id="nueva"
                   class="form-control form-control-lg" placeholder="••••••••" required>
            <div class="form-text">Mínimo 6 caracteres</div>
          </div>

          <div class="mb-4">
            <label for="confirmar" class="form-label fw-semibold small text-muted">
              Confirmar contraseña
            </label>
            <input type="password" name="confirmar" id="confirmar"
                   class="form-control form-control-lg" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-oro btn-lg w-100">
            <i class="fas fa-key me-2"></i>Restablecer contraseña
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
